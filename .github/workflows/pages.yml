name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Configure Jekyll base path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          config = Path('_config.yml')
          baseurl = 'baseurl: ' + json.dumps(os.environ['PAGES_BASE_PATH'])
          config.write_text(re.sub(r'^baseurl:.*$', lambda match: baseurl, config.read_text(), flags=re.MULTILINE))
          PY

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Take ownership of generated site
        run: sudo chown -R "$(id -u):$(id -g)" _site

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build search index
        run: |
          npm ci
          npm run search:index

      - name: Check metadata, sitemap, and local links
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 scripts/check_site.py --baseurl "$PAGES_BASE_PATH"

      - name: Check worked-example arithmetic
        run: python3 scripts/check_math.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
