- id: money
  term: "Money"
  definition: "Something widely accepted as payment for goods and services and to settle amounts owed. Modern money includes notes, coins, and bank account balances."
- id: currency
  term: "Currency"
  definition: "A particular system of money, such as the US dollar, euro, or Japanese yen."
- id: medium-of-exchange
  term: "Medium of exchange"
  definition: "Something people accept as payment, allowing them to trade without directly swapping goods or services."
- id: unit-of-account
  term: "Unit of account"
  definition: "A shared unit used to state, record, and compare prices and amounts owed."
- id: store-of-value
  term: "Store of value"
  definition: "Something that carries value into the future. Its ability to buy goods and services may still change over time."
- id: principal
  term: "Principal"
  definition: "The starting amount saved, invested, or borrowed, separate from interest. For a loan being repaid, remaining principal means the borrowed amount still unpaid, excluding interest."
- id: interest
  term: "Interest"
  definition: "Money paid for the use of money, such as money earned on savings or charged on borrowing."
- id: interest-rate
  term: "Interest rate"
  definition: "Interest expressed as a percentage of an amount over a stated period, such as 5% per year."
- id: simple-interest
  term: "Simple interest"
  definition: "Interest calculated only on the original principal, without charging or earning interest on earlier interest."
- id: compound-interest
  term: "Compound interest"
  definition: "Interest calculated on both principal and interest previously added to it."
- id: compounding
  term: "Compounding"
  definition: "The process of adding earnings to an amount so those earnings can themselves earn more. It can also increase debt when unpaid interest is added and begins attracting interest."
- id: inflation
  term: "Inflation"
  definition: "An increase in the general level of prices over time, which reduces what an unchanged amount of money can buy."
- id: purchasing-power
  term: "Purchasing power"
  definition: "The quantity of goods and services an amount of money can buy."
- id: return
  term: "Return"
  definition: "The gain or loss from saving or investing over a stated period, including money received and changes in value. It can be expressed as an amount or a percentage."
- id: nominal-return
  term: "Nominal return"
  definition: "A gain or loss over a period measured before adjusting for inflation."
- id: real-return
  term: "Real return"
  definition: "A return adjusted for inflation to measure the change in purchasing power. For the same period, it equals (1 + nominal return) divided by (1 + inflation rate), minus 1, with rates written as decimals."
- id: time-value-of-money
  term: "Time value of money"
  definition: "The idea that the timing of receiving or paying money affects its value because money available now can be used or earn a return before a future date."
- id: future-value
  term: "Future value"
  definition: "The amount that money today would grow to by a future date using an assumed rate of growth."
- id: present-value
  term: "Present value"
  definition: "Today's equivalent of a future amount, calculated using a chosen discount rate."
- id: discounting
  term: "Discounting"
  definition: "Calculating the present value of a future amount by working backward using a discount rate."
- id: discount-rate
  term: "Discount rate"
  definition: "The rate used to convert a future amount into its present value. In other contexts, this phrase may describe a central bank lending rate; here it means the rate used for comparing money at different times."
- id: risk
  term: "Risk"
  definition: "Uncertainty about a financial outcome, including the possibility of losing money or falling short of a financial need or expectation."
- id: liquidity
  term: "Liquidity"
  definition: "How easily and quickly something can be converted into spendable money without a large loss in value."
- id: opportunity-cost
  term: "Opportunity cost"
  definition: "The value of the best alternative given up when making a choice. It can include money, time, experiences, or convenience."
- id: personal-finance
  term: "Personal finance"
  definition: "How a person or household manages money, including spending, saving, borrowing, and planning for the future."
- id: financial-wellbeing
  term: "Financial wellbeing"
  definition: "Being able to manage ongoing money needs, handle financial setbacks, work toward future goals, and make choices that support your life."
- id: income
  term: "Income"
  definition: "Money received over a period, such as pay from work, benefits, or a pension. Borrowed money is not income."
- id: take-home-pay
  term: "Take-home pay"
  definition: "Pay received after taxes and other payroll deductions have been removed."
- id: expense
  term: "Expense"
  definition: "A cost of goods, services, or other obligations. In a household budget, expenses are the costs you plan to cover."
- id: budget
  term: "Budget"
  definition: "A plan for how to use the money available over a stated period, including spending, saving, and debt payments."
- id: cash-flow
  term: "Cash flow"
  definition: "Money moving in and out over a period, including when it arrives and when it leaves. Positive totals do not guarantee enough money on every date."
- id: emergency-fund
  term: "Emergency fund"
  definition: "Money set aside for unexpected costs or a loss of income, kept available for use when needed."
- id: sinking-fund
  term: "Sinking fund"
  definition: "In household budgeting, money gradually set aside for a known future cost, such as an annual bill. The term has other uses in business finance."
- id: debt
  term: "Debt"
  definition: "Money owed that must be repaid, sometimes with interest or fees."
- id: minimum-payment
  term: "Minimum payment"
  definition: "The smallest payment required by a lender for a billing period. Paying it may still leave a balance that attracts interest."
- id: debt-avalanche
  term: "Debt avalanche"
  definition: "A repayment approach that makes required payments on all debts and directs extra money to the debt with the highest interest rate first."
- id: debt-snowball
  term: "Debt snowball"
  definition: "A repayment approach that makes required payments on all debts and directs extra money to the debt with the smallest balance first."
- id: credit
  term: "Credit"
  definition: "An arrangement that lets someone borrow money or obtain goods or services now with an agreement to pay later."
- id: credit-report
  term: "Credit report"
  definition: "A record of borrowing accounts and payment history compiled by a credit reporting organization. Its contents and uses depend on the country."
- id: credit-score
  term: "Credit score"
  definition: "A number produced by a model to estimate borrowing repayment risk, often using information from a credit report. Different models can produce different scores."
- id: credit-limit
  term: "Credit limit"
  definition: "The maximum amount a lender allows someone to borrow on a particular credit account."
- id: credit-utilization
  term: "Credit utilization"
  definition: "The share of available credit being used, commonly calculated for credit cards as reported balances divided by credit limits, expressed as a percentage."
- id: financial-goal
  term: "Financial goal"
  definition: "A desired outcome involving money, made more concrete by specifying an amount and a target date."
- id: retirement
  term: "Retirement"
  definition: "A stage of life when someone reduces or stops paid work and relies more on other sources of money."
- id: pension
  term: "Pension"
  definition: "A retirement arrangement intended to provide money later in life. Its structure and use of the name vary by country and plan."
- id: contribution
  term: "Contribution"
  definition: "Money paid into a savings or retirement plan by a person, employer, or another contributor."
- id: employer-match
  term: "Employer match"
  definition: "Money an employer adds to a retirement plan based on an employee’s contributions, subject to the plan’s rules and limits."
- id: vesting
  term: "Vesting"
  definition: "Earning a non-forfeitable right to a benefit or contribution, often after meeting a retirement plan’s service requirements."
- id: estate-planning
  term: "Estate planning"
  definition: "Preparing arrangements for who will manage your affairs if you cannot and how your money and property will be handled after death."
- id: will
  term: "Will"
  definition: "A legal document directing how certain money and property should be handled after death. Its requirements and effect depend on local law."
- id: beneficiary
  term: "Beneficiary"
  definition: "A person or organization entitled or designated to receive money, property, or benefits under an account, policy, will, or other arrangement."
- id: inheritance
  term: "Inheritance"
  definition: "Money or property received from someone after their death."
- id: power-of-attorney
  term: "Power of attorney"
  definition: "A legal document authorizing someone to act on another person’s behalf. Its scope, when it takes effect, and how long it lasts depend on the document and local law."
- id: accounting
  term: "Accounting"
  definition: "Recording, organizing, and reporting financial events so people can understand an organization’s finances."
- id: financial-analysis
  term: "Financial analysis"
  definition: "Examining financial information to understand performance, financial position, and questions that need further investigation."
- id: asset
  term: "Asset"
  definition: "A resource controlled by a person or organization that is expected to provide future economic benefit."
- id: liability
  term: "Liability"
  definition: "A present obligation to transfer money, goods, services, or other economic resources to another party."
- id: equity
  term: "Equity"
  definition: "The residual interest in an organization’s recorded assets after subtracting its liabilities. Accounting equity is not necessarily its market value."
- id: balance-sheet
  term: "Balance sheet"
  definition: "A financial statement showing assets, liabilities, and equity at a particular date; also called a statement of financial position."
- id: inventory
  term: "Inventory"
  definition: "Goods held for sale, or materials and unfinished goods intended to become products for sale."
- id: revenue
  term: "Revenue"
  definition: "Amounts earned from an organization’s ordinary activities, such as selling goods or providing services, before subtracting expenses."
- id: accrual-accounting
  term: "Accrual accounting"
  definition: "Recording the financial effects of events when they occur, including revenue when earned and expenses when incurred, rather than only when cash changes hands."
- id: cash-basis-accounting
  term: "Cash basis accounting"
  definition: "An accounting approach that generally records revenue when cash is received and expenses when cash is paid. Tax rules may require exceptions."
- id: accounts-receivable
  term: "Accounts receivable"
  definition: "Amounts customers owe for goods or services already provided."
- id: accounts-payable
  term: "Accounts payable"
  definition: "Amounts owed to suppliers for goods or services already received."
- id: cost-of-goods-sold
  term: "Cost of goods sold"
  definition: "The recorded cost of goods sold during a period, rather than the cost of all goods purchased during that period."
- id: depreciation
  term: "Depreciation"
  definition: "Systematically allocating the depreciable cost of a tangible long-lived asset over its estimated useful life. It is not a direct measure of changes in market price."
- id: carrying-amount
  term: "Carrying amount"
  definition: "The amount at which an asset or liability appears in the accounts after applicable adjustments; also called book value."
- id: income-statement
  term: "Income statement"
  definition: "A financial statement showing revenue, expenses, and resulting profit or loss over a period."
- id: gross-profit
  term: "Gross profit"
  definition: "Revenue from sales minus the cost of the goods or services sold, before other expenses are deducted."
- id: net-profit
  term: "Net profit"
  definition: "The amount remaining after all recognized expenses are subtracted from revenue and other income for a period. A negative result is a net loss."
- id: cash-flow-statement
  term: "Cash flow statement"
  definition: "A financial statement explaining changes in cash and cash equivalents over a period, grouped into operating, investing, and financing activities."
- id: statement-of-changes-in-equity
  term: "Statement of changes in equity"
  definition: "A financial statement explaining changes in owners’ recorded interest over a period, including profits, losses, contributions, and distributions."
- id: financial-ratio
  term: "Financial ratio"
  definition: "A comparison calculated by dividing one financial amount by another to help assess a business. Its definition, period, and context matter."
- id: gross-profit-margin
  term: "Gross profit margin"
  definition: "Gross profit divided by sales revenue, usually expressed as a percentage."
- id: net-profit-margin
  term: "Net profit margin"
  definition: "Net profit divided by revenue for the same period, usually expressed as a percentage."
- id: current-asset
  term: "Current asset"
  definition: "An asset classified as short term, generally including cash and resources expected to be used, sold, or collected within the normal operating cycle or twelve months. Detailed classification depends on the reporting framework."
- id: current-liability
  term: "Current liability"
  definition: "An obligation classified as short term, generally because it is due within the normal operating cycle or twelve months. Detailed classification depends on the reporting framework."
- id: current-ratio
  term: "Current ratio"
  definition: "Current assets divided by current liabilities at the same date. It compares recorded short-term resources with short-term obligations but does not guarantee timely payment."
- id: working-capital
  term: "Working capital"
  definition: "Current assets minus current liabilities at a particular date. It is an amount, not a ratio or a cash balance."
- id: financial-statement-notes
  term: "Financial statement notes"
  definition: "Explanations accompanying financial statements that provide accounting policies, estimates, breakdowns, and other relevant disclosures."
- id: audit
  term: "Audit"
  definition: "An independent examination of financial statements to support an opinion under applicable auditing standards. It provides reasonable rather than absolute assurance about material misstatements."
- id: investing
  term: "Investing"
  definition: "Committing money to assets with the aim of receiving future income or growth, while accepting uncertainty and possible loss."
- id: portfolio
  term: "Portfolio"
  definition: "A collection of investments held by a person or organization."
- id: time-horizon
  term: "Time horizon"
  definition: "The length of time before money is expected to be needed for a particular goal."
- id: risk-tolerance
  term: "Risk tolerance"
  definition: "How willing an investor is to accept uncertainty and investment losses."
- id: risk-capacity
  term: "Risk capacity"
  definition: "How much financial loss a person can absorb without undermining essential needs or important goals."
- id: stock
  term: "Stock"
  definition: "An ownership interest in a company, usually divided into shares. Its value can rise or fall, and distributions to owners are not guaranteed."
- id: dividend
  term: "Dividend"
  definition: "A distribution by a company to its shareholders, commonly in cash. A company may reduce, suspend, or omit dividends."
- id: bond
  term: "Bond"
  definition: "A debt investment under which an issuer promises payments to investors according to stated terms. Payments and repayment are subject to the issuer’s ability to meet its obligations."
- id: asset-class
  term: "Asset class"
  definition: "A broad group of investments with similar characteristics, such as stocks or bonds. Investments within a class can still differ substantially."
- id: asset-allocation
  term: "Asset allocation"
  definition: "How a portfolio is divided among asset classes, commonly expressed as percentages of its value."
- id: diversification
  term: "Diversification"
  definition: "Spreading investments across different holdings and sources of risk to reduce dependence on any one outcome. It does not eliminate the possibility of loss."
- id: investment-fund
  term: "Investment fund"
  definition: "A vehicle that pools investors’ money and invests it according to a stated strategy."
- id: mutual-fund
  term: "Mutual fund"
  definition: "A pooled investment vehicle whose ordinary open-end shares are generally bought or redeemed at the next calculated per-share net asset value, subject to applicable fees and rules."
- id: exchange-traded-fund
  term: "Exchange-traded fund (ETF)"
  definition: "An investment fund with shares traded on an exchange during the trading day. The trading price can differ from the per-share value of the fund’s underlying net assets."
- id: market-index
  term: "Market index"
  definition: "A rules-based measure tracking a selected group of investments. An index is a measurement, not an investment that can be purchased directly."
- id: index-fund
  term: "Index fund"
  definition: "An investment fund that seeks to track a specified market index. Costs and implementation can cause its results to differ from the index."
- id: passive-investing
  term: "Passive investing"
  definition: "Following a stated market index or systematic exposure rather than trying to select investments that outperform it."
- id: active-investing
  term: "Active investing"
  definition: "Selecting or changing investments based on judgments intended to meet an objective, often to outperform a benchmark."
- id: benchmark
  term: "Benchmark"
  definition: "A reference used to evaluate investment performance. A useful comparison reflects the portfolio’s strategy, risks, period, and measurement conventions."
- id: rebalancing
  term: "Rebalancing"
  definition: "Adjusting a portfolio back toward its target allocation after its proportions change. Trades, new contributions, or withdrawals can be used."
- id: expense-ratio
  term: "Expense ratio"
  definition: "A fund’s annual operating expenses expressed as a percentage of its average net assets. It does not include every possible cost to an investor."
- id: due-diligence
  term: "Due diligence"
  definition: "Investigating an investment’s features, risks, costs, and supporting information before deciding whether it fits a goal."
- id: prospectus
  term: "Prospectus"
  definition: "A formal disclosure document describing an investment offering, including information such as its objectives, risks, costs, and terms. Requirements depend on the jurisdiction and product."
- id: valuation
  term: "Valuation"
  definition: "Estimating what an asset or business is worth using assumptions about future benefits, risks, and relevant comparisons."
- id: behavioral-bias
  term: "Behavioral bias"
  definition: "A recurring pattern in judgment that can distort financial decisions, such as favoring evidence that supports an existing belief."
- id: bank
  term: "Bank"
  definition: "A regulated institution that accepts deposits and provides services such as payments and lending. Its permitted activities depend on its charter and jurisdiction."
- id: credit-union
  term: "Credit union"
  definition: "A member-owned financial cooperative offering services such as deposit accounts and loans, subject to membership and local regulatory rules."
- id: deposit
  term: "Deposit"
  definition: "Money held in an account at a deposit-taking institution, representing an amount that institution owes the account holder under the account terms."
- id: checking-account
  term: "Checking account"
  definition: "A deposit account primarily used for receiving money and making everyday payments; often called a current account outside the United States."
- id: savings-account
  term: "Savings account"
  definition: "A deposit account intended for setting money aside, often paying interest and subject to account-specific access rules."
- id: term-deposit
  term: "Term deposit"
  definition: "A deposit held for an agreed period under stated terms; early withdrawal may be restricted or penalized. Common forms include certificates of deposit."
- id: annual-percentage-yield
  term: "Annual percentage yield (APY)"
  definition: "An annualized measure of deposit interest earnings that reflects compounding under stated assumptions. Actual earnings depend on the rate, balance, fees, and account terms."
- id: overdraft
  term: "Overdraft"
  definition: "A situation in which an institution pays a transaction despite insufficient available money in the account, creating an amount owed by the account holder."
- id: deposit-insurance
  term: "Deposit insurance"
  definition: "Protection for eligible deposits if an insured institution fails, subject to the scheme’s limits and conditions. It is not insurance against all financial losses."
- id: loan
  term: "Loan"
  definition: "Money provided by a lender under an agreement requiring repayment, usually with interest or other charges."
- id: loan-term
  term: "Loan term"
  definition: "The agreed length of a loan until its scheduled final repayment. A longer term can lower scheduled payments while increasing total interest."
- id: installment-loan
  term: "Installment loan"
  definition: "A loan repaid through a scheduled series of payments over an agreed period. Payments need not all be the same size."
- id: revolving-credit
  term: "Revolving credit"
  definition: "An arrangement allowing repeated borrowing and repayment up to an agreed limit, subject to the lender’s terms."
- id: collateral
  term: "Collateral"
  definition: "Property pledged to support a borrowing obligation that a lender may be able to seize or sell following default under applicable law."
- id: secured-loan
  term: "Secured loan"
  definition: "A loan backed by specified collateral. The collateral can be at risk if the borrower fails to meet the agreement."
- id: unsecured-loan
  term: "Unsecured loan"
  definition: "A loan not backed by specified collateral. The borrower remains legally obligated to repay, and lenders may pursue remedies allowed by law."
- id: mortgage
  term: "Mortgage"
  definition: "A loan secured by real property, commonly used to purchase a home. Failure to meet its terms can put the property at risk."
- id: fixed-interest-rate
  term: "Fixed interest rate"
  definition: "An interest rate that stays unchanged for a specified period, which may or may not be the full loan term."
- id: variable-interest-rate
  term: "Variable interest rate"
  definition: "An interest rate that can change under the agreement’s rules, often in relation to a reference rate."
- id: amortization
  term: "Amortization"
  definition: "In lending, paying down loan principal over time through scheduled payments. The word also describes cost allocation for certain assets in accounting."
- id: annual-percentage-rate
  term: "Annual percentage rate (APR)"
  definition: "An annualized borrowing-cost measure calculated under applicable disclosure rules. Which fees it includes and how it is calculated depend on the jurisdiction and product."
- id: underwriting
  term: "Underwriting"
  definition: "In lending, evaluating a borrower and proposed loan to decide whether to lend and on what terms."
- id: credit-risk
  term: "Credit risk"
  definition: "The possibility of financial loss because a borrower or other counterparty fails to meet agreed payment obligations."
- id: debt-to-income-ratio
  term: "Debt-to-income ratio (DTI)"
  definition: "Monthly debt payments divided by gross monthly income, usually expressed as a percentage. Included obligations and qualifying limits depend on the lender and product."
- id: delinquency
  term: "Delinquency"
  definition: "Being overdue on a required payment. Reporting and legal consequences depend on the agreement and local rules."
- id: default
  term: "Default"
  definition: "Failure to meet obligations under a borrowing agreement, as defined by the contract and applicable law. It can include missed payments or other breaches."
- id: refinancing
  term: "Refinancing"
  definition: "Replacing an existing debt with a new loan. A lower payment does not necessarily mean a lower total cost."
- id: debt-restructuring
  term: "Debt restructuring"
  definition: "Changing the terms of an existing debt, such as its payment schedule or interest rate, by agreement or through a legal process."
- id: bankruptcy
  term: "Bankruptcy"
  definition: "A legal process for addressing debts that cannot be paid, potentially involving repayment, sale of assets, or relief from some obligations. Rules and outcomes depend on jurisdiction and case."
- id: supply
  term: "Supply"
  definition: "The quantity of a good or service that sellers are willing to offer at a given price over a stated period."
- id: demand
  term: "Demand"
  definition: "The quantity of a good or service that buyers are willing to purchase at a given price over a stated period."
- id: market
  term: "Market"
  definition: "An arrangement, physical or online, in which buyers and sellers exchange goods, services, or assets, often coordinated through prices."
- id: incentive
  term: "Incentive"
  definition: "Something, such as a price, cost, reward, or penalty, that encourages a particular choice or behavior."
- id: business-cycle
  term: "Business cycle"
  definition: "The recurring, irregular pattern of economic expansion and contraction in a country or region over time."
- id: economic-expansion
  term: "Economic expansion"
  definition: "A period during which overall economic activity, such as production and employment, is generally increasing."
- id: recession
  term: "Recession"
  definition: "A period during which overall economic activity is generally declining. Exact definitions and dating methods vary by country and institution."
- id: central-bank
  term: "Central bank"
  definition: "A public institution responsible for a country or region's currency and monetary policy, and often for bank supervision and financial stability."
- id: monetary-policy
  term: "Monetary policy"
  definition: "Actions a central bank takes to influence the availability and cost of money and credit, commonly to pursue goals such as stable prices and full employment."
- id: policy-rate
  term: "Policy rate"
  definition: "A short-term interest rate set or targeted by a central bank, used as its main tool to influence borrowing costs and economic activity."
- id: fiscal-policy
  term: "Fiscal policy"
  definition: "Government decisions about spending and taxation used to influence economic activity, separate from a central bank's monetary policy."
- id: money-supply
  term: "Money supply"
  definition: "The total amount of money circulating in an economy at a given time, measured using different definitions that include varying combinations of cash and bank deposits."
- id: gross-domestic-product
  term: "Gross domestic product (GDP)"
  definition: "The total monetary value of goods and services produced within a country over a stated period, commonly used to measure the size and growth of an economy."
- id: unemployment-rate
  term: "Unemployment rate"
  definition: "The share of people in the labor force who do not have a job but are available for and actively seeking work, according to a given country's definition."
- id: economic-indicator
  term: "Economic indicator"
  definition: "A statistic, such as GDP, the unemployment rate, or an inflation measure, used to assess the condition or direction of an economy."
- id: financial-institution
  term: "Financial institution"
  definition: "An organization, such as a bank, credit union, insurer, or investment firm, that provides financial services like accepting deposits, lending, or managing investments."
- id: systemic-risk
  term: "Systemic risk"
  definition: "The possibility that the failure or distress of one financial institution or market spreads to others, threatening the stability of the wider financial system."
- id: financial-crisis
  term: "Financial crisis"
  definition: "A period of severe disruption to financial institutions or markets, often involving sharp asset price declines, credit shortages, or institution failures."
- id: payment
  term: "Payment"
  definition: "The transfer of money from a payer to a payee, whether to buy something, repay a debt, or move money for another purpose."
- id: payer
  term: "Payer"
  definition: "The person or organization sending money in a payment."
- id: payee
  term: "Payee"
  definition: "The person or organization receiving money in a payment."
- id: payment-instrument
  term: "Payment instrument"
  definition: "A method used to start a payment, such as a card, bank transfer, or direct debit."
- id: card-network
  term: "Card network"
  definition: "A system, such as Visa or Mastercard, that sets rules for card payments and routes transactions between the card issuer and the acquirer."
- id: card-issuer
  term: "Card issuer"
  definition: "The bank or financial institution that provides a payment card to a cardholder and decides whether to approve or decline transactions on it."
- id: acquirer
  term: "Acquirer"
  definition: "The bank or payment provider that enables a merchant to accept card payments and receives the funds from a card sale on the merchant's behalf."
- id: authorization
  term: "Authorization"
  definition: "A card issuer's approval that a specific transaction can proceed, based on available funds or credit and other checks, before the money actually moves."
- id: interchange-fee
  term: "Interchange fee"
  definition: "A fee the acquirer pays the card issuer for each card transaction, which is normally built into what merchants pay to accept card payments."
- id: bank-transfer
  term: "Bank transfer"
  definition: "An instruction to move money directly from one bank account to another, also called a credit transfer."
- id: direct-debit
  term: "Direct debit"
  definition: "An arrangement letting a payee collect money directly from a payer's bank account, usually for recurring payments, under the payer's advance authorization."
- id: instant-payment
  term: "Instant payment"
  definition: "A bank transfer that is processed and made available to the payee within seconds, at any time, rather than only during business hours or after a delay of hours or days."
- id: payment-processor
  term: "Payment processor"
  definition: "A company that handles the technical steps of accepting, checking, and routing a payment on behalf of a merchant or a bank."
- id: clearing
  term: "Clearing"
  definition: "The exchange and checking of transaction details and calculation of obligations before settlement. In payment systems, this establishes what participating institutions owe; in securities markets, it also covers obligations to deliver securities."
- id: settlement
  term: "Settlement"
  definition: "The completion of a transaction through the required transfers. In payment systems, it is the final transfer of funds fulfilling payment obligations; in securities markets, it also involves delivery of the securities."
- id: payment-rail
  term: "Payment rail"
  definition: "The underlying network and infrastructure used to move money for a particular type of payment, such as a card network or a bank transfer system."
- id: remittance
  term: "Remittance"
  definition: "A transfer of money, often sent by a person working in one country to family or others in another country."
- id: cross-border-payment
  term: "Cross-border payment"
  definition: "A payment sent from a payer in one country to a payee in another, usually involving a currency conversion."
- id: correspondent-bank
  term: "Correspondent bank"
  definition: "A bank that provides services, such as processing payments, to another bank, often in a different country, helping money move across borders."
- id: wire-transfer
  term: "Wire transfer"
  definition: "A direct, typically same-day transfer of funds between banks, often used for large payments or international payments."
- id: exchange-rate
  term: "Exchange rate"
  definition: "The price of one currency stated in terms of another, used to convert an amount from one currency into another."
- id: foreign-exchange-margin
  term: "Foreign-exchange margin"
  definition: "The difference between the exchange rate a provider applies to a customer's payment and the market's reference exchange rate, which functions as an extra, often less visible, cost."
- id: authentication
  term: "Authentication"
  definition: "The process of confirming that someone attempting a payment or accessing an account is who they claim to be."
- id: strong-customer-authentication
  term: "Strong customer authentication"
  definition: "A requirement, used in some jurisdictions, that a payment be confirmed using at least two independent forms of identity verification, such as something the payer knows and something they possess."
- id: fraud
  term: "Fraud"
  definition: "Intentional deception carried out to obtain money or property unlawfully, including using someone else's payment details without permission."
- id: dispute
  term: "Dispute"
  definition: "A payer's formal challenge to a transaction, such as a claim that it was unauthorized, incorrect, or for goods or services never received."
- id: chargeback
  term: "Chargeback"
  definition: "A reversal of a card payment, initiated through the card network after a successful dispute, that returns funds from the merchant to the cardholder."
- id: financial-market
  term: "Financial market"
  definition: "A system in which participants issue or trade financial claims and contracts. It may operate through exchanges or networks of dealers."
- id: financial-instrument
  term: "Financial instrument"
  definition: "A financial claim or contract with specified rights or obligations, such as a share, bond, or derivative."
- id: primary-market
  term: "Primary market"
  definition: "The market in which newly issued financial instruments are sold, typically to raise funds for their issuer."
- id: secondary-market
  term: "Secondary market"
  definition: "The market in which existing financial instruments are traded between holders, rather than newly issued by the issuer."
- id: face-value
  term: "Face value"
  definition: "The stated principal amount of a debt instrument, used to calculate payments such as a bond’s coupon and normally due at maturity under its terms."
- id: coupon
  term: "Coupon"
  definition: "A bond’s contractual interest payment. A fixed coupon rate is applied to face value, not the current market price."
- id: maturity
  term: "Maturity"
  definition: "The scheduled date on which a debt instrument’s principal becomes due under its terms."
- id: money-market
  term: "Money market"
  definition: "Markets for short-term borrowing and lending, commonly involving debt due within a year."
- id: treasury-bill
  term: "Treasury bill"
  definition: "A short-term government debt instrument. U.S. Treasury bills pay face value at maturity and are sold at a discount or at face value."
- id: commercial-paper
  term: "Commercial paper"
  definition: "Short-term debt issued by companies, commonly unsecured, to meet financing needs."
- id: commodity
  term: "Commodity"
  definition: "A basic physical good, such as wheat, oil, or a metal, traded in physical markets or referenced by financial contracts."
- id: current-yield
  term: "Current yield"
  definition: "For a bond, annual coupon payments divided by its current market price. It excludes changes in price and gains or losses on repayment of principal."
- id: exchange
  term: "Exchange"
  definition: "An organized trading venue operating under rules for bringing buyers and sellers together."
- id: broker
  term: "Broker"
  definition: "A person or firm arranging or executing financial transactions for customers. A firm may also act as a dealer trading for its own account."
- id: market-maker
  term: "Market maker"
  definition: "A firm that stands ready to buy and sell an instrument at quoted prices for stated quantities, subject to market rules and conditions."
- id: bid-price
  term: "Bid price"
  definition: "A quoted price at which a buyer is willing to buy a stated quantity of an instrument."
- id: ask-price
  term: "Ask price"
  definition: "A quoted price at which a seller is willing to sell a stated quantity of an instrument; also called the offer price."
- id: bid-ask-spread
  term: "Bid–ask spread"
  definition: "The difference between the quoted ask price and bid price for an instrument. It is one component of trading cost."
- id: price-discovery
  term: "Price discovery"
  definition: "The process through which orders, trades, and information help establish market prices. It does not ensure that prices equal an asset’s true value."
- id: market-order
  term: "Market order"
  definition: "An instruction to buy or sell at the best available prices when executed, without guaranteeing a particular price."
- id: limit-order
  term: "Limit order"
  definition: "An instruction to buy at a specified price or lower, or sell at a specified price or higher. Execution is not guaranteed."
- id: stop-order
  term: "Stop order"
  definition: "An order that becomes a market order after its specified stop condition is triggered. The eventual execution price can differ from the stop price."
- id: derivative
  term: "Derivative"
  definition: "A contract whose value or payments depend on a referenced asset, rate, index, or other measure."
- id: forward-contract
  term: "Forward contract"
  definition: "An agreement between parties to buy or sell an asset at a price agreed today for a future date, often customized and privately negotiated."
- id: futures-contract
  term: "Futures contract"
  definition: "A standardized exchange-traded agreement referencing an asset or measure for future delivery or cash settlement, with gains and losses generally settled daily."
- id: option
  term: "Option"
  definition: "A contract giving its buyer a right, rather than an obligation, to buy or sell a referenced asset at specified terms within a stated time. The seller takes on the corresponding obligation if exercised."
- id: swap
  term: "Swap"
  definition: "A contract to exchange payments determined by agreed formulas, such as fixed-rate payments for variable-rate payments."
- id: hedging
  term: "Hedging"
  definition: "Taking a position intended to offset a particular risk in another exposure. A hedge can involve costs, imperfect offsets, and new risks."
- id: call-option
  term: "Call option"
  definition: "An option giving its buyer the right to buy the referenced asset at the strike price under the contract’s timing and other terms."
- id: put-option
  term: "Put option"
  definition: "An option giving its buyer the right to sell the referenced asset at the strike price under the contract’s timing and other terms."
- id: strike-price
  term: "Strike price"
  definition: "The agreed purchase or sale price used when an option is exercised."
- id: option-premium
  term: "Option premium"
  definition: "The price paid by an option buyer to acquire the contract and received by its seller."
- id: leverage
  term: "Leverage"
  definition: "Using borrowing or contracts to obtain exposure larger than the money initially committed, magnifying gains and losses relative to that amount."
- id: margin
  term: "Margin"
  definition: "Money or eligible assets required to support a trading position. In securities borrowing it supports a loan; in futures it supports performance of the contract rather than purchasing the underlying asset."
- id: margin-call
  term: "Margin call"
  definition: "A demand for additional money or eligible assets when an account no longer meets applicable margin requirements. Positions may be closed without waiting for the investor to respond."

- id: corporate-finance
  term: "Corporate finance"
  definition: "How organizations obtain funding, invest resources, and manage the financial consequences of their decisions."

- id: capital-allocation
  term: "Capital allocation"
  definition: "Choosing how to use financial resources across operations, investments, debt repayment, and distributions to owners."

- id: financial-forecast
  term: "Financial forecast"
  definition: "An estimate of future financial results based on stated assumptions that can be revised as information changes."

- id: treasury
  term: "Treasury"
  definition: "The business function responsible for managing cash, funding, and related financial risks."

- id: equity-financing
  term: "Equity financing"
  definition: "Raising money by providing investors with an ownership interest in a business."

- id: capital-structure
  term: "Capital structure"
  definition: "The mix of debt and equity used to finance a business."

- id: loan-covenant
  term: "Loan covenant"
  definition: "A contractual requirement or restriction a borrower agrees to, such as maintaining a financial ratio or limiting additional borrowing."

- id: bootstrapping
  term: "Bootstrapping"
  definition: "Building a business mainly with founders’ resources and cash generated by the business."

- id: angel-investor
  term: "Angel investor"
  definition: "An individual who invests their own money in early-stage businesses, often in exchange for an ownership interest."

- id: venture-capital
  term: "Venture capital"
  definition: "Professionally managed investment, typically in young businesses with high growth potential, seeking substantial future gains."

- id: crowdfunding
  term: "Crowdfunding"
  definition: "Raising money from many contributors, usually through a platform, using arrangements such as donations, rewards, loans, or ownership investments."

- id: pre-money-valuation
  term: "Pre-money valuation"
  definition: "The negotiated value of a business’s existing ownership immediately before new investment in a funding round."

- id: post-money-valuation
  term: "Post-money valuation"
  definition: "The value of a business’s ownership immediately after a funding round; in a simple round, pre-money valuation plus new investment."

- id: dilution
  term: "Dilution"
  definition: "A reduction in an existing owner’s percentage ownership when additional shares are issued."

- id: cost-of-capital
  term: "Cost of capital"
  definition: "The return funding providers require for committing money to a business at a given level of risk."

- id: weighted-average-cost-of-capital
  term: "Weighted average cost of capital (WACC)"
  definition: "An average of the costs of a business’s funding sources, weighted by their shares of total capital value, commonly including applicable tax adjustments to debt cost."

- id: capital-budgeting
  term: "Capital budgeting"
  definition: "Evaluating major investments whose costs and benefits extend into the future."

- id: incremental-cash-flow
  term: "Incremental cash flow"
  definition: "The difference in cash flow caused by a decision, compared with what would happen without it."

- id: sunk-cost
  term: "Sunk cost"
  definition: "A cost already incurred that cannot be recovered and does not change with the decision now being evaluated."

- id: net-present-value
  term: "Net present value (NPV)"
  definition: "The sum of the present values of cash inflows less the present values of cash outflows, including any initial investment."

- id: payback-period
  term: "Payback period"
  definition: "The time required for cumulative undiscounted project cash flows to recover the initial investment."

- id: sensitivity-analysis
  term: "Sensitivity analysis"
  definition: "Changing one assumption at a time to examine how it affects an estimated result."

- id: scenario-analysis
  term: "Scenario analysis"
  definition: "Changing a set of assumptions together to examine a possible outcome."

- id: cash-burn-rate
  term: "Cash burn rate"
  definition: "The rate at which a business consumes cash, usually measured monthly; specify whether it means gross outflows or net outflows after receipts."

- id: cash-runway
  term: "Cash runway"
  definition: "An estimate of how long available cash will support a business’s assumed spending pattern, optionally measured to a stated minimum balance."

- id: acquisition
  term: "Acquisition"
  definition: "A transaction in which one business buys another business or a controlling interest in it."

- id: merger
  term: "Merger"
  definition: "A transaction combining businesses into one organization, with the legal form depending on the agreed structure and jurisdiction."

- id: synergy
  term: "Synergy"
  definition: "An expected benefit from combining businesses beyond what they could achieve separately, such as lower duplicated costs."
